document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Single-Cycle Datapath Trace<\u002Ftitle>\n<style>\n  body { font-family: system-ui, sans-serif; color: #171717; background: #FFFFFF; margin: 24px; font-size: 15px; }\n  h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }\n  .note { color: #55524C; margin: 0 0 16px; }\n  .controls { display: flex; gap: 10px 26px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }\n  .controls label { white-space: nowrap; }\n  .mono, input { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; }\n  input#instr { width: 260px; }\n  input.val { width: 110px; }\n  #encoding { font-family: ui-monospace, Menlo, Consolas, monospace; color: #171717; margin: 8px 0 0; min-height: 20px; }\n  #encoding .fl { color: #8A857C; }\n  #encoding .eb { color: #1D5BD8; }\n  #encoding .er { color: #5FA8F0; }\n  #encoding .eg { color: #12A150; }\n  #err { color: #A02A1E; min-height: 20px; margin: 4px 0 2px; }\n  #stage { max-width: 1500px; }\n  svg { width: 100%; height: auto; display: block; }\n  @media print { .controls, .note, #err, h1 { display: none; } body { margin: 0; } }\n\n  /* ---- publisher construction: black components, gray until used ---- */\n  .blk rect, .blk ellipse, .blk path { fill: #fff; stroke: #B5B1A8; stroke-width: 4.2; stroke-miterlimit: 10; }\n  .blk.lit rect, .blk.lit ellipse, .blk.lit path { stroke: #000; }\n  .blk-t, .port, .muxn, .muxlbl, .field-lbl, .ctrl-lbl { font-family: Arial, Helvetica, sans-serif; }\n  .blk-t { fill: #9A958B; font-weight: 700; font-size: 30px; }\n  .blk-t.small { font-size: 24px; }\n  .port { fill: #9A958B; font-size: 20px; }\n  .blk.lit .blk-t, .blk.lit .port { fill: #000; }\n\n  /* wires: solid always; a colored (used) line is always visibly heavier than gray.\n     Gray baseline is a real bus weight, never a hairline. */\n  .w-line { fill: none; stroke: #C9C5BC; stroke-width: 3.4; }\n  .wire.thick .w-line { stroke-width: 5; }\n  .wire.data.active .w-line { stroke-width: 5.4; }\n  .wire.data.active.thick .w-line { stroke-width: 6.2; }\n  .wire.ctrl.asserted .w-line { stroke: #0AA8C2; stroke-width: 4; }\n  .wire.ctrl.asserted.thick .w-line { stroke-width: 5.6; }\n  .wire[data-route=\"fetch\"].active .w-line  { stroke: #7226D9; }\n  .wire[data-route=\"pcloop\"].active .w-line { stroke: #AC8CF5; }\n  .wire[data-route=\"instr\"].active .w-line  { stroke: #1D5BD8; }\n  .wire[data-route=\"rd\"].active .w-line     { stroke: #5FA8F0; }\n  .wire[data-route=\"rdata\"].active .w-line  { stroke: #DE9300; }\n  .wire[data-route=\"imm\"].active .w-line    { stroke: #12A150; }\n  .wire[data-route=\"alures\"].active .w-line { stroke: #EA560D; }\n  .wire[data-route=\"wb\"].active .w-line     { stroke: #F79862; }\n  .wire[data-route=\"branch\"].active .w-line { stroke: #C127B0; }\n  .wire[data-route=\"konst\"].active .w-line  { stroke: #171717; }\n  .jdot { fill: #454138; }\n\n  /* values: plain ink text with a white halo — no boxes, no shadows */\n  .chip-t { fill: #171717; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 26px; font-weight: 600;\n            paint-order: stroke; stroke: #FFFFFF; stroke-width: 11; stroke-linejoin: round; }\n  .chip-t.sm { font-size: 22px; stroke-width: 9; }\n  .field-lbl { fill: #6B675E; font-size: 21px; paint-order: stroke; stroke: #FFFFFF; stroke-width: 9; stroke-linejoin: round; }\n  .ctrl-lbl { fill: #9A958B; font-size: 23px; paint-order: stroke; stroke: #FFFFFF; stroke-width: 6; stroke-linejoin: round; }\n  .ctrl-lbl.on { fill: #0AA8C2; font-weight: 700; }\n\n  /* muxes: Arial digits at the entry edge; selected digit is ink, not route-colored */\n  .muxn { fill: #B5B1A8; font-size: 27px; }\n  .muxn.on { font-weight: 800; fill: #000; }\n  .muxlbl { font-family: \"Arial Black\", Arial-Black, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #9A958B; }\n  .blk.lit .muxlbl { fill: #000; }\n  .blk.mux { }\n\n  /* blank mode: values hidden, selections unmarked; colored routes stay */\n  .blank .chip-t { visibility: hidden; }\n  .blank .muxn.on { font-weight: 400; fill: #B5B1A8; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<h1>Single-cycle datapath trace<\u002Fh1>\n<p class=\"note\">Type one instruction and the values it needs; every used line shows its color and the value it carries. Addresses are always hex; the dec/hex switch applies to data values. Supported: R-type, addi/andi/ori/xori/slti, shifts, lw, sw, beq.<\u002Fp>\n\n<div class=\"controls\">\n  <label>instruction <input id=\"instr\" spellcheck=\"false\" data-comment-anchor=\"adc62bb62f-input\"><\u002Flabel>\n  <label>PC <input class=\"val\" id=\"pc\" data-comment-anchor=\"4a0086803f-input\"><\u002Flabel>\n  <span id=\"stateins\" style=\"display:contents;\"><\u002Fspan>\n  <label style=\"margin-left:auto;\">values\n    <label data-comment-anchor=\"20ecf476e5-label\"><input type=\"radio\" name=\"fmt\" value=\"hex\" checked=\"\"> hex<\u002Flabel>\n    <label><input type=\"radio\" name=\"fmt\" value=\"dec\"> dec<\u002Flabel>\n  <\u002Flabel>\n  <label><input type=\"checkbox\" id=\"blank\"> blank (worksheet)<\u002Flabel>\n<\u002Fdiv>\n<div id=\"encoding\" data-comment-anchor=\"725bc8b3d4-div\"><\u002Fdiv>\n<div id=\"err\"><\u002Fdiv>\n\n<div id=\"stage\">\n  <svg id=\"dp\" viewBox=\"0 0 1900 1490\" preserveAspectRatio=\"xMidYMid meet\" xmlns=\"http://www.w3.org/2000/svg\"><\u002Fsvg>\n<\u002Fdiv>\n\n<script src=\"804796f6-e50c-418c-b7fd-154acb7511e2\"><\u002Fscript>\n<script src=\"9b38fcb9-db8a-4445-88f7-a70d72cad1b5\"><\u002Fscript>\n<script src=\"d55f06b3-a619-40c1-bb4b-7974ca2076a7\"><\u002Fscript>\n<script>\n(function () {\n  'use strict';\n  const $ = s => document.querySelector(s);\n  const KEY = 'dptrace-v2';\n\n  // uppercase hex, padded to the full 32 bits (registers are 32 bits; make it visible)\n  const origShort = RV.fmtShort;\n  RV.fmtShort = (v, fmt) => {\n    if (fmt === 'hex') return '0x' + (v >>> 0).toString(16).toUpperCase().padStart(8, '0');\n    return origShort(v, fmt);\n  };\n  const fmtAddr = v => '0x' + (v >>> 0).toString(16).toUpperCase().padStart(8, '0');\n\n  let regs = { 2: (0x7FFFEFFC | 0) };   // sp\n  let mem = {};\n  let pc = 0x00400000;\n  let instr = 'andi sp, sp, -15';\n  let lastGood = null, lastT = null;\n\n  try {\n    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');\n    if (saved && typeof saved.instr === 'string') { regs = saved.regs || regs; mem = saved.mem || mem; pc = saved.pc | 0; instr = saved.instr; }\n  } catch (e) {}\n  function save() { try { localStorage.setItem(KEY, JSON.stringify({ regs, mem, pc, instr })); } catch (e) {} }\n\n  function fmtNow() { return document.querySelector('input[name=fmt]:checked').value; }\n  function fmtInput(v) { return fmtNow() === 'hex' ? '0x' + (v >>> 0).toString(16).toUpperCase().padStart(8, '0') : String(v | 0); }\n  function parseNum(str) {\n    str = String(str).trim();\n    if (!str) return 0;\n    const neg = str[0] === '-';\n    const body = neg ? str.slice(1) : str;\n    const v = /^0x/i.test(body) ? parseInt(body, 16) : parseInt(body, 10);\n    if (isNaN(v)) return null;\n    return (neg ? -v : v) | 0;\n  }\n\n  function machineState() {\n    const s = RV.newState();\n    Object.keys(regs).forEach(k => { if (+k > 0 && +k < 32) s.regs[+k] = regs[k] | 0; });\n    Object.keys(mem).forEach(k => { s.mem[+k] = mem[k] | 0; });\n    s.pc = pc | 0;\n    return s;\n  }\n\n  function neededRegs(t) {\n    const out = [];\n    if (t.rs1 !== 0) out.push(t.rs1);\n    if ((t.type === 'R' || t.type === 'S' || t.type === 'B') && t.rs2 !== 0 && !out.includes(t.rs2)) out.push(t.rs2);\n    return out;\n  }\n\n  function renderStateInputs(t, tr) {\n    const c = $('#stateins');\n    c.innerHTML = '';\n    if (!t) return;\n    neededRegs(t).forEach(i => {\n      const lab = document.createElement('label');\n      lab.innerHTML = '<span class=\"mono\">' + RV.regName(i) + '<\u002Fspan> = ';\n      const inp = document.createElement('input');\n      inp.className = 'val';\n      inp.value = fmtInput(regs[i] !== undefined ? regs[i] : 0);\n      inp.addEventListener('input', () => {\n        const v = parseNum(inp.value);\n        if (v === null) return;\n        regs[i] = v; save(); render(false);\n      });\n      lab.appendChild(inp);\n      c.appendChild(lab);\n    });\n    if (t.mnemonic === 'lw' && tr) {\n      const addr = tr.aluResult >>> 0;\n      const lab = document.createElement('label');\n      lab.innerHTML = '<span class=\"mono\" data-memlabel>Memory[' + fmtAddr(addr) + ']<\u002Fspan> = ';\n      const inp = document.createElement('input');\n      inp.className = 'val';\n      inp.value = fmtInput(mem[addr] !== undefined ? mem[addr] : 0);\n      inp.addEventListener('input', () => {\n        const v = parseNum(inp.value);\n        if (v === null) return;\n        mem[addr] = v; save(); render(false);\n      });\n      lab.appendChild(inp);\n      c.appendChild(lab);\n    }\n  }\n\n  // ---- field bits: write out what each tap actually carries ----\n  function fieldBits(tr) {\n    const b = tr.bin32, t = tr.t;\n    const s = (a, z) => b.slice(a, z);\n    const out = {};\n    out.tap_opcode = s(25, 32);\n    out.tap_rs1 = s(12, 17) + ' - ' + RV.regName(t.rs1);\n    if (t.type === 'R' || t.type === 'S' || t.type === 'B') out.tap_rs2 = s(7, 12) + ' - ' + RV.regName(t.rs2);\n    out.tap_rd = s(20, 25) + ((t.type === 'R' || t.type === 'I') ? ' - ' + RV.regName(t.rd) : '');\n    // NOTE: no value on the Instruction [31-0] tap into ImmGen — that wire carries\n    // the full 32-bit word; writing the 12-bit field there is wrong in essence.\n    return out;\n  }\n\n  function encodingLine(tr) {\n    const b = tr.bin32, t = tr.t;\n    const s = (a, z) => b.slice(a, z);\n    const g = (label, bits, cls) => '<span class=\"fl\">' + label + '<\u002Fspan> <span class=\"' + (cls || 'eb') + '\">' + bits + '<\u002Fspan>';\n    let parts;\n    if (t.type === 'R') parts = [g('funct7', s(0, 7)), g('rs2', s(7, 12)), g('rs1', s(12, 17)), g('funct3', s(17, 20)), g('rd', s(20, 25), 'er'), g('opcode', s(25, 32))];\n    else if (t.type === 'I') parts = [g('imm[11:0]', s(0, 12), 'eg'), g('rs1', s(12, 17)), g('funct3', s(17, 20)), g('rd', s(20, 25), 'er'), g('opcode', s(25, 32))];\n    else if (t.type === 'S') parts = [g('imm[11:5]', s(0, 7), 'eg'), g('rs2', s(7, 12)), g('rs1', s(12, 17)), g('funct3', s(17, 20)), g('imm[4:0]', s(20, 25), 'eg'), g('opcode', s(25, 32))];\n    else parts = [g('imm', s(0, 7), 'eg'), g('rs2', s(7, 12)), g('rs1', s(12, 17)), g('funct3', s(17, 20)), g('imm', s(20, 25), 'eg'), g('opcode', s(25, 32))];\n    return parts.join(' &nbsp; ');\n  }\n\n  function annotateControls(tr, blank) {\n    const c = tr.control;\n    const vals = {\n      Branch: c.Branch ? 1 : 0, MemRead: c.MemRead ? 1 : 0, MemtoReg: c.MemtoReg ? 1 : 0,\n      ALUOp: c.ALUOp, MemWrite: c.MemWrite ? 1 : 0, ALUSrc: c.ALUSrc ? 1 : 0, RegWrite: c.RegWrite ? 1 : 0,\n    };\n    Object.keys(vals).forEach(name => {\n      const el = document.querySelector('#cl_' + name);\n      if (el) el.textContent = blank ? name + ' =' : name + ' = ' + vals[name];\n    });\n  }\n\n  function render(rebuildInputs) {\n    const line = instr.trim();\n    let t = null, tr = null;\n    if (!line) { $('#err').textContent = ''; return; }\n    try {\n      t = RV.assemble(line);\n      tr = RV.step(machineState(), line);\n      $('#err').textContent = '';\n    } catch (e) {\n      $('#err').textContent = e.message;\n      return; // keep last good diagram while typing\n    }\n\n    lastGood = tr; lastT = t;\n    Engine.load(tr);\n    Engine.goTo(Engine.phases.length - 1);\n\n    const blank = $('#blank').checked;\n    // overwrite field taps with the actual bits\n    const fb = fieldBits(tr);\n    Object.keys(fb).forEach(id => Datapath.setValue(id, fb[id]));\n    // (no instruction-word value on the diagram: the encoding line above carries it)\n    // resolved operation on the ALU-control output; the line computes every cycle\n    Datapath.setValue('aluop_alu', tr.aluOp);\n    Datapath.setControl('aluop_alu', true);\n    // AND gate: output value at the line start; Zero line colors on branches\n    Datapath.setValue('and_pcsel', String(tr.pcSrc));\n    if (t.type === 'B') Datapath.setControl('alu_zero', true);\n    // the ALU->Address stub only carries a value for memory instructions (always hex)\n    if (t.mnemonic !== 'lw' && t.mnemonic !== 'sw') {\n      Datapath.setActive('alu_dmem', false);\n      Datapath.clearValue('alu_dmem');\n    } else {\n      Datapath.setValue('alu_dmem', fmtAddr(tr.aluResult));\n    }\n    // color only what is CONSUMED (a trace, not a wiring diagram):\n    // imm rises to the branch adder only on branches; the mux stub only when selected;\n    // Read data 2 only when something reads it; ImmGen output not at all on R-type\n    if (t.type === 'I') {\n      Datapath.setActive('rd2', false); Datapath.setActive('rd2_mux', false);\n      Datapath.clearValue('rd2_mux');\n      Datapath.setActive('tap_rs2', false); Datapath.clearValue('tap_rs2');\n    }\n    if (t.type === 'S') { Datapath.setActive('rd2_mux', false); Datapath.clearValue('rd2_mux'); }\n    // S/B have no write-register: bits [11:7] are immediate, not rd. Don't light the tap.\n    if (t.type === 'S' || t.type === 'B') { Datapath.setActive('tap_rd', false); Datapath.clearValue('tap_rd'); }\n    if (t.type === 'R') {\n      Datapath.setActive('imm_busV', false); Datapath.setActive('imm_mux', false);\n      Datapath.clearValue('imm_busV');\n    }\n    if (t.type === 'B') {\n      Datapath.setActive('imm_mux', false); Datapath.setActive('imm_up', true);\n      // both PC-mux inputs stay live: PC+4 and the branch target are both computed and\n      // delivered every cycle; the mux, not the wire, decides which one is taken. Keep\n      // both lit with their values whether or not the branch is taken.\n      Datapath.setActive('addpc_pcmux', true);\n      Datapath.setActive('addbr_pcmux', true);\n    }\n    // a mux that isn't consumed doesn't select (sw: nothing reads the write-back mux)\n    if (!(tr.control.RegWrite && tr.writeReg !== 0)) {\n      Datapath.clearMux('muxmem'); Datapath.lit('muxmem', false);\n    }\n    // ALU-result -> write-back mux lights only when the ALU result is what gets written\n    // back (R / I-arith). Branch and store write nothing; load writes memory, not ALU.\n    if (!(tr.control.RegWrite && tr.writeReg !== 0 && !tr.control.MemtoReg)) {\n      Datapath.setActive('alu_muxmem', false); Datapath.clearValue('alu_muxmem');\n    }\n    // the ALU-result output stub is consumed only if SOMETHING downstream reads it:\n    // memory address (lw/sw) or write-back (R / I-arith). On a branch the ALU computes\n    // the compare but its result value is unused (only Zero is consumed), so the stub\n    // stays dark; only muxout_alu (rd2 INTO the ALU) and alu_zero light.\n    const aluResUsed = (t.mnemonic === 'lw' || t.mnemonic === 'sw') ||\n                       (tr.control.RegWrite && tr.writeReg !== 0 && !tr.control.MemtoReg);\n    if (!aluResUsed) { Datapath.setActive('alu_res', false); Datapath.clearValue('alu_res'); }\n    // a mux output carries the COLOR of the selected input\n    Datapath.setRoute('muxout_alu', tr.control.ALUSrc ? 'imm' : 'rdata');\n    Datapath.setRoute('muxmem_wb', tr.control.MemtoReg ? 'wb' : 'alures');\n    Datapath.setRoute('pcmux_pc', tr.pcSrc ? 'branch' : 'pcloop');\n    // select signals are CONSUMED whenever their mux selects (even carrying a 0);\n    // enable signals (Branch/MemRead/MemWrite) stay by-value\n    Datapath.setControl('c_alusrc', true);\n    Datapath.setControl('and_pcsel', true);\n    Datapath.lit('and', true);\n    if (tr.control.RegWrite && tr.writeReg !== 0) Datapath.setControl('c_memtoreg', true);\n    // mux-select control labels light whenever their mux selects, even carrying a 0\n    // (ALUSrc always selects; MemtoReg only when the write-back mux is actually used)\n    Datapath.setCtrlLabel('ALUSrc', 'on');\n    if (tr.control.RegWrite && tr.writeReg !== 0) Datapath.setCtrlLabel('MemtoReg', 'on');\n    // PC family stays hex even in dec mode (addresses are names, not numbers)\n    Datapath.setValue('pc_vert', fmtAddr(tr.pc));\n    Datapath.setValue('pcmux_pc', fmtAddr(tr.nextPC));\n    Datapath.setValue('addpc_pcmux', fmtAddr(tr.pcPlus4));\n    if (t.type === 'B') {\n      Datapath.setValue('pc_branch', fmtAddr(tr.pc));\n      Datapath.setValue('addbr_pcmux', fmtAddr(tr.branchTarget));\n    }\n    annotateControls(tr, blank);\n    $('#encoding').innerHTML = blank ? '' : encodingLine(tr);\n    document.querySelector('#dp').classList.toggle('blank', blank);\n\n    const focusInside = document.activeElement && document.activeElement.closest && document.activeElement.closest('#stateins');\n    if (rebuildInputs !== false && !focusInside) renderStateInputs(t, tr);\n    else if (t.mnemonic === 'lw') {\n      // typing: never rebuild (focus would drop); just keep the address label current\n      const memlab = document.querySelector('#stateins [data-memlabel]');\n      if (memlab) memlab.textContent = 'Memory[' + fmtAddr(tr.aluResult) + ']';\n      else if (!focusInside) renderStateInputs(t, tr);\n    }\n  }\n\n  function init() {\n    Datapath.mount($('#dp'));\n    Engine.setFormat('hex');\n    $('#instr').value = instr;\n    $('#pc').value = fmtInput(pc);\n    $('#instr').addEventListener('input', () => { instr = $('#instr').value; save(); render(true); });\n    $('#pc').addEventListener('input', () => { const v = parseNum($('#pc').value); if (v !== null) { pc = v; save(); render(false); } });\n    document.querySelectorAll('input[name=fmt]').forEach(r => r.addEventListener('change', () => {\n      Engine.setFormat(fmtNow());\n      $('#pc').value = fmtInput(pc);\n      if (lastGood) render(true);\n    }));\n    $('#blank').addEventListener('change', () => render(false));\n    render(true);\n  }\n\n  window.DPTrace = {\n    set(newInstr, newRegs, newMem, newPc) {\n      if (newInstr !== undefined) instr = newInstr;\n      if (newRegs) regs = newRegs;\n      if (newMem) mem = newMem;\n      if (newPc !== undefined) pc = newPc | 0;\n      $('#instr').value = instr; $('#pc').value = fmtInput(pc);\n      render(true);\n    },\n    chip(id) {\n      const g = document.querySelector('#w_' + id);\n      if (!g) return null;\n      const chips = document.querySelectorAll('#layer-chips .chip');\n      // read via Datapath's own map\n      const c = Datapath._chipFor(id);\n      if (!c || c.style.display === 'none') return null;\n      return c.querySelector('.chip-t').textContent;\n    },\n    ctrl(name) { const el = document.querySelector('#cl_' + name); return el ? el.textContent : null; },\n    route(id) { const g = document.querySelector('#w_' + id); return g ? [g.className.baseVal, getComputedStyle(g.querySelector('.w-line')).stroke].join(' | ') : null; },\n  };\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\n  else init();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
